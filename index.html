<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pokemon finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h2 class="title">KNOW THE POKEMON</h2>
        <input type="text" placeholder="search for the pokemon" class="search">
    </div>
    <div class="maincard">
        <div class="Display">
            <h1 class="poketitle">POKEMON</h1>
            <img src="" class="display-card">
        </div>
        <div class="details">
            <div>
                <p class="labels" >Name:</p>
                <p id="pokename"></p>
            </div>
            <div>
                <p class="labels" >Types:</p>
                <p id="poketype"></p>
            </div>
            <div>
                <p class="labels">Abilities:</p>
                <p id="pokeabilities"></p>
            </div>
            <div>
                <p class="labels">Stats:</p>
                <p id="pokistats"></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
